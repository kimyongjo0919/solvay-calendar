<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOLVAY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>SOLVAY</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--main:#5c1424;--main2:#f4e8ea;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand .sub{font-size:12px;color:var(--sub);margin-top:-2px}
h1{letter-spacing:1px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
h1{font-size:18px;margin:0}
.dday{background:var(--main);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--main);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--main2);color:var(--main)}
.btn.small{width:auto;margin:0;padding:6px 12px;font-size:13px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta b{color:var(--ink);font-size:13px}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.next{margin-top:4px;font-size:13px;color:var(--main);white-space:pre-wrap;word-break:break-word}
.empty{color:var(--sub);text-align:center;padding:16px 0;font-size:14px}
.del{border:1px solid #fecaca;background:#fff;color:var(--bad);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer}
.acts{display:flex;gap:6px;flex:none}
.edt{border:1px solid #d8c3c8;background:#fff;color:var(--main);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer}
.edited{color:var(--sub);font-weight:400;font-size:11px}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,7,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hide{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns button{flex:1;margin-top:0}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer}
.calhead span{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cell{height:78px;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;text-align:left;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cell.blank{border:0;background:transparent;cursor:default}
.cell.today{border-color:var(--main);box-shadow:inset 0 0 0 1px var(--main)}
.cell.sel{background:var(--main2)}
.cell .n{font-weight:700}
.cell.sun .n{color:var(--bad)}
.tag{display:block;flex:none;border-radius:4px;padding:0 3px;font-size:10px;line-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.ev{background:#fde68a;color:#78350f}
.tag.lg{background:#dcfce7;color:#14532d}
.tag.dl{background:var(--bad);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--sub)}
td.l{text-align:left;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.pill.ok{background:#dcfce7;color:var(--ok)}
.pill.warn{background:#fef3c7;color:var(--warn)}
.pill.bad{background:#fee2e2;color:var(--bad)}
.pill.no{background:#f3f4f6;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;z-index:9;display:none;text-align:center}
.hide{display:none}
#splash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;overflow:hidden;touch-action:manipulation;background:radial-gradient(circle at 22% 28%,rgba(112,72,215,.30),rgba(112,72,215,0) 55%),radial-gradient(circle at 82% 72%,rgba(55,115,255,.26),rgba(55,115,255,0) 60%),radial-gradient(circle at 70% 18%,rgba(40,175,205,.14),rgba(40,175,205,0) 40%),radial-gradient(circle at 50% 50%,#0d1434,#03040b 78%)}
#splash.fade{opacity:0;transition:opacity .22s linear;pointer-events:none}
#splashCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#splashStage{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;perspective:900px;pointer-events:none}
#splashLogo{width:min(75vw,385px);height:auto;opacity:0;transform:scale(.04);will-change:transform,opacity;backface-visibility:hidden}
#splashFlash{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(205,222,255,.85) 28%,rgba(205,222,255,0) 72%);opacity:0;pointer-events:none;will-change:opacity}
#splashTag{position:absolute;left:0;right:0;top:calc(50% + min(32vw,165px) + 22px);text-align:center;color:#cdd7ff;font-size:13px;letter-spacing:5px;opacity:0;pointer-events:none}
#splashSkip{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.35);font-size:12px;pointer-events:none}
.installbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:8}
.installbar.hide{display:none}
.installbar img{width:44px;height:44px;border-radius:10px;flex:none}
.installbar .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
.installbar .t b{display:block;font-size:14px}
.installbar .go{border:0;background:var(--main);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.installbar .x{border:0;background:transparent;color:var(--sub);font-size:18px;padding:4px 6px;cursor:pointer}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabs button{padding:13px 4px}
.btn{padding:14px;font-size:17px}
@media (max-width:480px){
  .wrap{padding-left:10px;padding-right:10px}
  .card{padding:12px}
  .grid{gap:2px}
  .cell{height:72px;padding:2px;border-radius:6px}
  .tag{font-size:9px;padding:0 2px}
  .row{flex-direction:column;gap:0}
}
.err{color:var(--bad);font-size:14px;text-align:center;padding:20px 0}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <canvas id="splashCv"></canvas>
  <div id="splashStage"><img id="splashLogo" src="icons/logo-splash.png" alt=""></div>
  <div id="splashFlash"></div>
  <div id="splashTag">TEAM SOLVAY · STEAM R&amp;E</div>
  <div id="splashSkip">화면을 누르면 건너뜁니다</div>
</div>
<script>
(function () {
  var sp = document.getElementById('splash');
  window.__splashDone = false;
  var done = false, raf = 0, hardTimer = null;
  function finish() {
    if (done) { return; }
    done = true;
    try { if (raf) { cancelAnimationFrame(raf); } } catch (e) {}
    try { if (hardTimer) { clearTimeout(hardTimer); } } catch (e) {}
    try { if (sp && sp.parentNode) { sp.parentNode.removeChild(sp); } } catch (e) {}
    window.__splashDone = true;
    try { document.dispatchEvent(new Event('splashdone')); } catch (e) {}
  }
  if (!sp) { finish(); return; }
  try {
    if (sessionStorage.getItem('solvay_splash') === '1') { finish(); return; }
    sessionStorage.setItem('solvay_splash', '1');
  } catch (e) { /* 저장소를 못 써도 인트로는 그냥 보여 줍니다 */ }
  hardTimer = setTimeout(finish, 5000);
  try {
    var cv = document.getElementById('splashCv');
    var logo = document.getElementById('splashLogo');
    var flash = document.getElementById('splashFlash');
    var tag = document.getElementById('splashTag');
    var skip = document.getElementById('splashSkip');
    if (!cv || !logo || !flash || !tag || !skip) { finish(); return; }
    sp.addEventListener('click', finish);
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    if (reduce) {
      logo.style.opacity = '1';
      logo.style.transform = 'none';
      tag.style.opacity = '1';
      skip.style.display = 'none';
      setTimeout(function () { sp.className = 'fade'; }, 900);
      setTimeout(finish, 1300);
      return;
    }
    var ctx = cv.getContext('2d');
    if (!ctx) { finish(); return; }
    // 저사양 최적화: 캔버스는 1배 해상도, 별 개수 최소, 글로우는 이미지에 미리 구워 둠
    var lite = ((navigator.hardwareConcurrency || 8) <= 4) || ((navigator.deviceMemory || 8) <= 3);
    var W = window.innerWidth || 360, H = window.innerHeight || 640;
    cv.width = W; cv.height = H;
    window.addEventListener('resize', function () {
      W = window.innerWidth || W; H = window.innerHeight || H;
      cv.width = W; cv.height = H;
    });
    var N = lite ? 50 : 90, stars = [], i;
    function seed(s, anywhere) {
      var a = Math.random() * Math.PI * 2;
      var rad = 0.04 + Math.random() * 1.3;
      s.x = Math.cos(a) * rad;
      s.y = Math.sin(a) * rad;
      s.z = anywhere ? (0.05 + Math.random() * 0.95) : 1;
      s.x0 = 0; s.y0 = 0; s.x1 = 0; s.y1 = 0; s.b = 0; s.on = false;
    }
    for (i = 0; i < 160; i++) { var s0 = {}; seed(s0, true); stars.push(s0); }

    var A = 1600, Hd = 700, B = 750;
    var t0 = 0, last = 0, frames = 0, degraded = false, faded = false, tagOp = -1;
    function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
    function easeIn(p) { return p * p * p; }

    function frame(now) {
      if (done) { return; }
      if (!t0) { t0 = now; last = now; }
      var t = now - t0;
      var dt = Math.min(48, now - last) / 16.67;
      last = now;
      frames++;
      if (frames === 14 && !degraded && (now - t0) / 14 > 26) { degraded = true; N = Math.min(N, 35); }
      var speed, sc, op, rotY, rotX, tx, ty, fl, tg;
      if (t < A) {
        var p = t / A, e = easeOut(p);
        speed = 0.012 + 0.06 * (1 - p);
        sc = 0.04 + 0.96 * e;
        op = Math.min(1, p * 2.4);
        rotY = lite ? 0 : (1 - e) * -40; rotX = lite ? 0 : (1 - e) * 14;
        tx = (1 - e) * -0.22 * W; ty = (1 - e) * 0.16 * H;
        fl = 0; tg = 0;
      } else if (t < A + Hd) {
        var q = (t - A) / Hd;
        speed = 0.012;
        sc = 1 + 0.02 * Math.sin(q * Math.PI);
        op = 1; rotY = 0; rotX = 0; tx = 0; ty = 0;
        fl = 0; tg = Math.min(1, q * 2.2);
      } else {
        var r = Math.min(1, (t - A - Hd) / B), er = easeIn(r);
        speed = 0.012 + 0.1 * er;
        sc = 1 + er * 3.4;
        op = 1 - Math.max(0, (r - 0.5) / 0.5);
        rotY = 0; rotX = 0; tx = 0; ty = 0;
        fl = Math.sin(Math.min(1, r * 1.15) * Math.PI) * 0.9;
        tg = Math.max(0, 1 - r * 3);
        if (r > 0.72 && !faded) { faded = true; sp.className = 'fade'; }
        if (r >= 1) { finish(); return; }
      }
      logo.style.opacity = op.toFixed(2);
      logo.style.transform = (rotY === 0 && rotX === 0)
        ? 'translate3d(' + tx.toFixed(0) + 'px,' + ty.toFixed(0) + 'px,0) scale(' + sc.toFixed(3) + ')'
        : 'translate3d(' + tx.toFixed(0) + 'px,' + ty.toFixed(0) + 'px,0) rotateY(' + rotY.toFixed(1) + 'deg) rotateX(' + rotX.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      flash.style.opacity = fl.toFixed(2);
      var tgs = tg.toFixed(2);
      if (tagOp !== tgs) { tagOp = tgs; tag.style.opacity = tgs; }

      ctx.clearRect(0, 0, W, H);
      var f = Math.min(W, H) * 0.55, cx = W / 2, cy = H / 2, n = Math.min(N, stars.length), b;
      for (i = 0; i < n; i++) {
        var s = stars[i];
        s.on = false;
        var zPrev = s.z + speed * 2.2;
        s.z -= speed * dt;
        if (s.z <= 0.03) { seed(s, false); continue; }
        var x1 = cx + (s.x / s.z) * f, y1 = cy + (s.y / s.z) * f;
        if (x1 < -30 || x1 > W + 30 || y1 < -30 || y1 > H + 30) { seed(s, false); continue; }
        var zp = zPrev > 1.4 ? 1.4 : zPrev;
        s.x0 = cx + (s.x / zp) * f; s.y0 = cy + (s.y / zp) * f; s.x1 = x1; s.y1 = y1;
        s.b = s.z > 0.6 ? 0 : (s.z > 0.3 ? 1 : 2);
        s.on = true;
      }
      ctx.lineCap = 'round';
      for (b = 0; b < 3; b++) {
        ctx.strokeStyle = b === 0 ? 'rgba(200,215,255,0.35)' : (b === 1 ? 'rgba(225,235,255,0.65)' : 'rgba(255,255,255,0.95)');
        ctx.lineWidth = b === 0 ? 0.8 : (b === 1 ? 1.4 : 2.2);
        ctx.beginPath();
        for (i = 0; i < n; i++) {
          var st = stars[i];
          if (st.on && st.b === b) { ctx.moveTo(st.x0, st.y0); ctx.lineTo(st.x1, st.y1); }
        }
        ctx.stroke();
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  } catch (e) {
    finish();
  }
})();
</script>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icons/logo-small.png" alt="SOLVAY" width="40" height="40">
      <div>
        <h1>SOLVAY</h1>
        <div class="sub">STEAM R&amp;E 활동 기록</div>
      </div>
    </div>
    <div class="dday" id="dday">D-</div>
  </header>

  <div class="tabs">
    <button type="button" id="tabCal" class="on">일정</button>
    <button type="button" id="tabLog">기록</button>
    <button type="button" id="tabDash">교사 현황</button>
  </div>

  <div id="initErr" class="err hide"></div>

  <!-- 기록 -->
  <section id="paneLog" class="hide">
    <div class="card">
      <h2>오늘 활동 기록하기</h2>
      <label for="fName">이름</label>
      <select id="fName"></select>
      <label for="fDate">날짜</label>
      <input type="date" id="fDate">
      <label for="fDone">오늘 한 일 (구체적으로)</label>
      <textarea id="fDone" maxlength="1000" placeholder="예) 달걀껍질 분말 5g/10g 조건으로 침투 실험 3회 진행"></textarea>
      <label for="fNext">다음에 할 일 / 어려운 점</label>
      <textarea id="fNext" maxlength="1000" placeholder="예) 11/3까지 데이터 그래프 정리"></textarea>
      <button type="button" class="btn" id="btnLog">기록 저장</button>
    </div>
    <div class="card">
      <h2>팀 활동 기록</h2>
      <div class="edited" style="margin-bottom:8px">내 이름을 선택하면 내가 쓴 기록을 수정·삭제할 수 있어요.</div>
      <select id="fFilter"></select>
      <div id="feed"></div>
    </div>
  </section>

  <!-- 일정 -->
  <section id="paneCal">
    <div class="card">
      <div class="calhead">
        <button type="button" id="calPrev">&lt;</button>
        <span id="calTitle"></span>
        <button type="button" id="calNext">&gt;</button>
      </div>
      <div class="grid" id="calGrid"></div>
      <div style="font-size:12px;color:var(--sub);margin-top:8px">
        <span class="tag ev" style="display:inline-block">일정</span>
        <span class="tag lg" style="display:inline-block">기록</span>
        <span class="tag dl" style="display:inline-block">최종 마감</span>
      </div>
    </div>
    <div class="card">
      <h2 id="dayTitle">날짜를 눌러 보세요</h2>
      <div id="dayList"></div>
    </div>
    <div class="card">
      <h2>일정 추가</h2>
      <label for="eMe">작성자 (내 이름)</label>
      <select id="eMe"></select>
      <label for="eTitle">제목</label>
      <input type="text" id="eTitle" maxlength="100" placeholder="예) 보고서 초안 제출">
      <div class="row">
        <div>
          <label for="eDate">날짜</label>
          <input type="date" id="eDate">
        </div>
        <div>
          <label for="eType">구분</label>
          <select id="eType">
            <option value="전체">전체 일정</option>
            <option value="개인">개인 일정</option>
          </select>
        </div>
      </div>
      <div id="eWhoBox" class="hide">
        <label for="eWho">담당 학생</label>
        <select id="eWho"></select>
      </div>
      <button type="button" class="btn" id="btnEvt">일정 저장</button>
    </div>
  </section>

  <!-- 교사 현황 -->
  <section id="paneDash" class="hide">
    <div class="card" id="pinBox">
      <h2>교사 확인</h2>
      <label for="pinIn">PIN</label>
      <input type="password" id="pinIn" inputmode="numeric" autocomplete="off" placeholder="교사 PIN 입력">
      <button type="button" class="btn" id="btnPin">현황 보기</button>
    </div>
    <div class="card hide" id="dashBox">
      <h2>학생별 기록 현황</h2>
      <div id="dashInfo" style="font-size:13px;color:var(--sub);margin-bottom:6px"></div>
      <div id="dashTable"></div>
      <button type="button" class="btn ghost" id="btnDashRef">새로고침</button>
    </div>
  </section>
</div>
<div class="modal hide" id="editModal">
  <div class="sheet">
    <h2 id="mHead">수정</h2>
    <label for="mDate">날짜</label>
    <input type="date" id="mDate">
    <div id="mLogBox">
      <label for="mDone">한 일</label>
      <textarea id="mDone" maxlength="1000"></textarea>
      <label for="mNext">다음에 할 일 / 어려운 점</label>
      <textarea id="mNext" maxlength="1000"></textarea>
    </div>
    <div id="mEvBox" class="hide">
      <label for="mTitle">제목</label>
      <input type="text" id="mTitle" maxlength="100">
      <label for="mType">구분</label>
      <select id="mType">
        <option value="전체">전체 일정</option>
        <option value="개인">개인 일정</option>
      </select>
      <div id="mWhoBox" class="hide">
        <label for="mWho">담당 학생</label>
        <select id="mWho"></select>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="btn ghost" id="mCancel">취소</button>
      <button type="button" class="btn" id="mSave">저장</button>
    </div>
  </div>
</div>
<div class="installbar hide" id="installBar">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>SOLVAY 앱 설치</b><span id="installMsg">홈 화면에 추가하면 앱처럼 쓸 수 있어요.</span></div>
  <button type="button" class="go" id="installGo">설치</button>
  <button type="button" class="x" id="installX" aria-label="닫기">✕</button>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var S = { students: [], groups: {}, me: '', edit: null, deadline: '', today: '', logs: [], events: [], pin: '', year: 0, month: 0, sel: '', busy: false };
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = text; }
    return e;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dnum(s) {
    var p = String(s).split('-');
    return Math.round(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 86400000);
  }
  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2800);
  }

  function apiUrl() { return String(window.SOLVAY_API_URL || '').trim(); }

  function buildRequest(fn, a) {
    var url = apiUrl();
    if (fn === 'getInit') { return { method: 'GET', url: url + '?action=init&_=' + Date.now() }; }
    if (fn === 'getAll') { return { method: 'GET', url: url + '?action=all&_=' + Date.now() }; }
    var body = null;
    if (fn === 'addLog') { body = { action: 'addLog', name: a[0], date: a[1], done: a[2], next: a[3] }; }
    else if (fn === 'addEvent') { body = { action: 'addEvent', title: a[0], date: a[1], who: a[2], type: a[3], creator: a[4] }; }
    else if (fn === 'updateLog') { body = { action: 'updateLog', id: a[0], editor: a[1], pin: a[2], date: a[3], done: a[4], next: a[5] }; }
    else if (fn === 'updateEvent') { body = { action: 'updateEvent', id: a[0], editor: a[1], pin: a[2], title: a[3], date: a[4], who: a[5], type: a[6] }; }
    else if (fn === 'getDashboard') { body = { action: 'dashboard', pin: a[0] }; }
    else if (fn === 'deleteItem') { body = { action: 'delete', kind: a[0], id: a[1], pin: a[2], editor: a[3] }; }
    if (!body) { return null; }
    return { method: 'POST', url: url, body: JSON.stringify(body) };
  }

  function call(fn, args, onOk, onBad) {
    var failed = function (msg) {
      if (onBad) { onBad(msg); } else { toast(msg); }
    };
    var base = apiUrl();
    if (base.indexOf('http') !== 0) {
      failed('config.js에 웹앱 주소(URL)가 입력되지 않았습니다.');
      return;
    }
    var req = buildRequest(fn, args);
    if (!req) { failed('알 수 없는 요청입니다.'); return; }
    var ctrl = null, timer = null;
    try {
      if (window.AbortController) {
        ctrl = new AbortController();
        timer = setTimeout(function () { ctrl.abort(); }, 30000);
      }
    } catch (e) { ctrl = null; }
    var opts = { method: req.method, redirect: 'follow', cache: 'no-store' };
    if (req.method === 'POST') {
      opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opts.body = req.body;
    }
    if (ctrl) { opts.signal = ctrl.signal; }
    var handleOk = function (res) {
      if (timer) { clearTimeout(timer); }
      if (!res) { failed('응답이 없습니다. 잠시 후 다시 시도해 주세요.'); return; }
      if (res.ok === false) { failed(res.msg || '처리하지 못했습니다.'); return; }
      onOk(res);
    };
    var handleFail = function () {
      if (timer) { clearTimeout(timer); }
      failed('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    };
    try {
      fetch(req.url, opts)
        .then(function (r) { return r.json(); })
        .then(handleOk, handleFail);
    } catch (e) {
      handleFail();
    }
  }

  /* ---------- 탭 ---------- */
  function showTab(which) {
    var map = { log: ['tabLog', 'paneLog'], cal: ['tabCal', 'paneCal'], dash: ['tabDash', 'paneDash'] };
    for (var k in map) {
      if (Object.prototype.hasOwnProperty.call(map, k)) {
        $(map[k][0]).className = (k === which) ? 'on' : '';
        $(map[k][1]).className = (k === which) ? '' : 'hide';
      }
    }
    if (which === 'cal') { renderCal(); }
  }

  /* ---------- 초기화 ---------- */
  function fillStudents() {
    var sels = ['fName', 'eWho', 'eMe', 'mWho'];
    var saved = '';
    try { saved = localStorage.getItem('steam_name') || ''; } catch (e) { saved = ''; }
    for (var i = 0; i < sels.length; i++) {
      var s = $(sels[i]);
      clear(s);
      var first = el('option', '', '이름 선택');
      first.value = '';
      s.appendChild(first);
      appendGrouped(s);
    }
    if (saved && S.students.indexOf(saved) >= 0) { S.me = saved; $('fName').value = saved; $('eMe').value = saved; }
    var f = $('fFilter');
    clear(f);
    var all = el('option', '', '전체 보기');
    all.value = '';
    f.appendChild(all);
    appendGrouped(f);
  }

  function appendGrouped(sel) {
    var order = [];
    var i;
    for (i = 0; i < S.students.length; i++) {
      var g = S.groups[S.students[i]] || '';
      if (order.indexOf(g) < 0) { order.push(g); }
    }
    for (var gi = 0; gi < order.length; gi++) {
      var parent = sel;
      if (order[gi]) {
        parent = document.createElement('optgroup');
        parent.label = order[gi];
        sel.appendChild(parent);
      }
      for (i = 0; i < S.students.length; i++) {
        if ((S.groups[S.students[i]] || '') !== order[gi]) { continue; }
        var o = el('option', '', S.students[i]);
        o.value = S.students[i];
        parent.appendChild(o);
      }
    }
  }

  function renderDday() {
    var d = $('dday');
    if (!S.deadline || !validDate(S.deadline) || !validDate(S.today)) { d.textContent = 'STEAM R&E'; return; }
    var diff = dnum(S.deadline) - dnum(S.today);
    d.textContent = diff > 0 ? ('마감 D-' + diff) : (diff === 0 ? '마감 D-Day' : ('마감 D+' + (-diff)));
  }

  function whenSplashDone(fn) {
    if (window.__splashDone || !document.getElementById('splash')) { fn(); return; }
    var ran = false;
    var go = function () { if (ran) { return; } ran = true; fn(); };
    document.addEventListener('splashdone', go);
    setTimeout(go, 6000);
  }

  function init() {
    call('getInit', [], function (res) {
      whenSplashDone(function () {
      S.students = res.students || [];
      S.groups = res.groups || {};
      S.deadline = res.deadline || '';
      S.today = res.today || '';
      var p = S.today.split('-');
      S.year = Number(p[0]);
      S.month = Number(p[1]) - 1;
      S.sel = S.today;
      $('initErr').className = 'err hide';
      $('fDate').value = S.today;
      $('eDate').value = S.today;
      fillStudents();
      renderDday();
      loadAll(false);
      });
    }, function (msg) {
      var e = $('initErr');
      e.textContent = msg + ' (새로고침 해 주세요)';
      e.className = 'err';
    });
  }

  function loadAll(silent) {
    call('getAll', [], function (res) {
      S.logs = res.logs || [];
      S.events = res.events || [];
      if (res.today) { S.today = res.today; renderDday(); }
      renderFeed();
      renderCal();
    }, function (msg) {
      if (!silent) { toast(msg); }
    });
  }

  /* ---------- 기록 ---------- */
  function renderFeed() {
    var box = $('feed');
    clear(box);
    var who = $('fFilter').value;
    var shown = 0;
    for (var i = 0; i < S.logs.length && shown < 60; i++) {
      var L = S.logs[i];
      if (who && L.name !== who) { continue; }
      shown++;
      var it = el('div', 'item');
      var meta = el('div', 'meta');
      var left = el('span');
      left.appendChild(el('b', '', L.name));
      left.appendChild(document.createTextNode('  ' + L.date));
      if (L.mod) { left.appendChild(el('span', 'edited', ' · 수정됨')); }
      meta.appendChild(left);
      appendActions(meta, 'log', L);
      it.appendChild(meta);
      it.appendChild(el('div', 'txt', L.done));
      if (L.next) { it.appendChild(el('div', 'next', '다음: ' + L.next)); }
      box.appendChild(it);
    }
    if (!shown) { box.appendChild(el('div', 'empty', '아직 기록이 없어요.')); }
  }

  function delButton(kind, id) {
    var b = el('button', 'del', '삭제');
    b.type = 'button';
    b.addEventListener('click', function () {
      if (!window.confirm('정말 삭제할까요?')) { return; }
      call('deleteItem', [kind, id, S.pin, S.me], function () {
        toast('삭제했습니다.');
        loadAll(false);
      });
    });
    return b;
  }

  function canEdit(kind, item) {
    if (S.pin) { return true; }
    var owner = (kind === 'log') ? item.name : item.by;
    return !!(S.me && owner && S.me === owner);
  }

  function appendActions(meta, kind, item) {
    if (!canEdit(kind, item)) { return; }
    var box = el('span', 'acts');
    var b = el('button', 'edt', '수정');
    b.type = 'button';
    b.addEventListener('click', function () { openEdit(kind, item); });
    box.appendChild(b);
    box.appendChild(delButton(kind, item.id));
    meta.appendChild(box);
  }

  function setMe(v) {
    S.me = v || '';
    $('fName').value = S.me;
    $('eMe').value = S.me;
    try { if (S.me) { localStorage.setItem('steam_name', S.me); } } catch (e) { /* 무시 */ }
    renderFeed();
    renderDay();
  }

  function openEdit(kind, item) {
    S.edit = { kind: kind, id: item.id };
    $('mDate').value = item.date;
    if (kind === 'log') {
      $('mHead').textContent = '기록 수정';
      $('mLogBox').className = '';
      $('mEvBox').className = 'hide';
      $('mDone').value = item.done || '';
      $('mNext').value = item.next || '';
    } else {
      $('mHead').textContent = '일정 수정';
      $('mLogBox').className = 'hide';
      $('mEvBox').className = '';
      $('mTitle').value = item.title || '';
      var personal = (item.type === '개인');
      $('mType').value = personal ? '개인' : '전체';
      $('mWho').value = personal ? item.who : '';
      $('mWhoBox').className = personal ? '' : 'hide';
    }
    $('editModal').className = 'modal';
  }

  function closeEdit() {
    S.edit = null;
    $('editModal').className = 'modal hide';
  }

  function saveEdit() {
    if (!S.edit || S.busy) { return; }
    var ed = S.edit;
    var date = $('mDate').value;
    if (!validDate(date)) { toast('날짜를 선택해 주세요.'); return; }
    var fn, args;
    if (ed.kind === 'log') {
      var done = $('mDone').value.trim();
      var next = $('mNext').value.trim();
      if (!done) { toast('한 일을 적어 주세요.'); return; }
      fn = 'updateLog';
      args = [ed.id, S.me, S.pin, date, done, next];
    } else {
      var title = $('mTitle').value.trim();
      var type = $('mType').value;
      var who = $('mWho').value;
      if (!title) { toast('일정 제목을 적어 주세요.'); return; }
      if (type === '개인' && !who) { toast('담당 학생을 선택해 주세요.'); return; }
      fn = 'updateEvent';
      args = [ed.id, S.me, S.pin, title, date, who, type];
    }
    S.busy = true;
    $('mSave').disabled = true;
    $('mSave').textContent = '저장 중...';
    var release = function () {
      S.busy = false;
      $('mSave').disabled = false;
      $('mSave').textContent = '저장';
    };
    call(fn, args, function () {
      release();
      closeEdit();
      toast('수정했습니다.');
      loadAll(false);
    }, function (msg) {
      release();
      toast(msg);
    });
  }

  function submitLog() {
    if (S.busy) { return; }
    var name = $('fName').value;
    var date = $('fDate').value;
    var done = $('fDone').value.trim();
    var next = $('fNext').value.trim();
    if (!name) { toast('이름을 선택해 주세요.'); return; }
    if (!validDate(date)) { toast('날짜를 선택해 주세요.'); return; }
    if (!done) { toast('오늘 한 일을 적어 주세요.'); return; }
    S.busy = true;
    $('btnLog').disabled = true;
    $('btnLog').textContent = '저장 중...';
    var release = function () {
      S.busy = false;
      $('btnLog').disabled = false;
      $('btnLog').textContent = '기록 저장';
    };
    call('addLog', [name, date, done, next], function () {
      release();
      try { localStorage.setItem('steam_name', name); } catch (e) { /* 무시 */ }
      $('fDone').value = '';
      $('fNext').value = '';
      toast('저장했습니다.');
      loadAll(false);
    }, function (msg) {
      release();
      toast(msg);
    });
  }

  /* ---------- 일정 ---------- */
  function renderCal() {
    if (!S.year) { return; }
    $('calTitle').textContent = S.year + '년 ' + (S.month + 1) + '월';
    var g = $('calGrid');
    clear(g);
    for (var d = 0; d < 7; d++) { g.appendChild(el('div', 'dow', DOW[d])); }

    var evBy = {}, lgBy = {};
    for (var i = 0; i < S.events.length; i++) {
      var e = S.events[i];
      if (!evBy[e.date]) { evBy[e.date] = []; }
      evBy[e.date].push(e);
    }
    for (var j = 0; j < S.logs.length; j++) {
      var l = S.logs[j];
      lgBy[l.date] = (lgBy[l.date] || 0) + 1;
    }

    var first = new Date(Date.UTC(S.year, S.month, 1)).getUTCDay();
    var days = new Date(Date.UTC(S.year, S.month + 1, 0)).getUTCDate();
    for (var b = 0; b < first; b++) { g.appendChild(el('div', 'cell blank')); }
    for (var n = 1; n <= days; n++) {
      var key = S.year + '-' + pad(S.month + 1) + '-' + pad(n);
      var cls = 'cell';
      if (key === S.today) { cls += ' today'; }
      if (key === S.sel) { cls += ' sel'; }
      if ((first + n - 1) % 7 === 0) { cls += ' sun'; }
      var c = el('button', cls);
      c.type = 'button';
      c.appendChild(el('span', 'n', String(n)));
      if (key === S.deadline) { c.appendChild(el('span', 'tag dl', '마감')); }
      var evs = evBy[key] || [];
      if (evs.length) {
        c.appendChild(el('span', 'tag ev', (evs.length > 1 ? '(' + evs.length + ') ' : '') + evs[0].title));
      }
      if (lgBy[key]) { c.appendChild(el('span', 'tag lg', '기록 ' + lgBy[key])); }
      c.addEventListener('click', (function (k) {
        return function () { S.sel = k; $('eDate').value = k; renderCal(); };
      })(key));
      g.appendChild(c);
    }
    renderDay();
  }

  function renderDay() {
    var box = $('dayList');
    clear(box);
    if (!S.sel) { return; }
    $('dayTitle').textContent = S.sel + (S.sel === S.deadline ? ' (최종 마감일)' : '');
    var any = false, i;
    for (i = 0; i < S.events.length; i++) {
      var e = S.events[i];
      if (e.date !== S.sel) { continue; }
      any = true;
      var it = el('div', 'item');
      var meta = el('div', 'meta');
      meta.appendChild(el('b', '', (e.type === '개인' ? '[개인] ' : '[전체] ') + e.who));
      appendActions(meta, 'event', e);
      it.appendChild(meta);
      it.appendChild(el('div', 'txt', e.title));
      if (e.by) { it.appendChild(el('div', 'edited', '작성: ' + e.by + (e.mod ? ' · 수정됨' : ''))); }
      box.appendChild(it);
    }
    for (i = 0; i < S.logs.length; i++) {
      var L = S.logs[i];
      if (L.date !== S.sel) { continue; }
      any = true;
      var it2 = el('div', 'item');
      var m2 = el('div', 'meta');
      m2.appendChild(el('b', '', '[기록] ' + L.name));
      appendActions(m2, 'log', L);
      it2.appendChild(m2);
      it2.appendChild(el('div', 'txt', L.done));
      box.appendChild(it2);
    }
    if (!any) { box.appendChild(el('div', 'empty', '이 날은 일정과 기록이 없어요.')); }
  }

  function moveMonth(delta) {
    var m = S.month + delta;
    var y = S.year;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    S.month = m;
    S.year = y;
    renderCal();
  }

  function submitEvent() {
    if (S.busy) { return; }
    var title = $('eTitle').value.trim();
    var date = $('eDate').value;
    var type = $('eType').value;
    var who = $('eWho').value;
    if (!title) { toast('일정 제목을 적어 주세요.'); return; }
    if (!validDate(date)) { toast('날짜를 선택해 주세요.'); return; }
    if (type === '개인' && !who) { toast('담당 학생을 선택해 주세요.'); return; }
    var me = $('eMe').value;
    if (!me) { toast('작성자(내 이름)를 선택해 주세요.'); return; }
    S.busy = true;
    $('btnEvt').disabled = true;
    $('btnEvt').textContent = '저장 중...';
    var release = function () {
      S.busy = false;
      $('btnEvt').disabled = false;
      $('btnEvt').textContent = '일정 저장';
    };
    call('addEvent', [title, date, who, type, me], function () {
      release();
      $('eTitle').value = '';
      S.sel = date;
      var p = date.split('-');
      S.year = Number(p[0]);
      S.month = Number(p[1]) - 1;
      toast('일정을 저장했습니다.');
      loadAll(false);
    }, function (msg) {
      release();
      toast(msg);
    });
  }

  /* ---------- 교사 현황 ---------- */
  function renderDash(res) {
    $('pinBox').className = 'card hide';
    $('dashBox').className = 'card';
    $('dashInfo').textContent = '기준일 ' + res.today + ' · 3일 이상 기록이 없으면 빨간색으로 표시됩니다.';
    var box = $('dashTable');
    clear(box);
    var tb = el('table');
    var head = el('tr');
    var cols = ['이름', '오늘', '최근 기록', '7일', '전체'];
    for (var c = 0; c < cols.length; c++) { head.appendChild(el('th', '', cols[c])); }
    tb.appendChild(head);
    var rows = res.rows || [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var tr = el('tr');
      tr.appendChild(el('td', 'l', r.name));
      var t1 = el('td');
      t1.appendChild(el('span', r.today ? 'pill ok' : 'pill no', r.today ? '완료' : '없음'));
      tr.appendChild(t1);
      var t2 = el('td');
      if (r.since < 0) {
        t2.appendChild(el('span', 'pill bad', '기록 없음'));
      } else {
        var cls = r.since >= 3 ? 'pill bad' : (r.since >= 2 ? 'pill warn' : 'pill ok');
        var txt = r.since === 0 ? '오늘' : (r.since + '일 전');
        t2.appendChild(el('span', cls, txt));
      }
      tr.appendChild(t2);
      tr.appendChild(el('td', '', String(r.week)));
      tr.appendChild(el('td', '', String(r.total)));
      tb.appendChild(tr);
    }
    box.appendChild(tb);
    if (!rows.length) { box.appendChild(el('div', 'empty', '설정 시트에 학생 명단이 없습니다.')); }
  }

  function openDash(pin) {
    call('getDashboard', [pin], function (res) {
      S.pin = pin;
      renderDash(res);
      renderFeed();
      renderDay();
    }, function (msg) {
      toast(msg);
    });
  }

  /* ---------- 이벤트 연결 ---------- */
  function bind() {
    $('tabLog').addEventListener('click', function () { showTab('log'); });
    $('tabCal').addEventListener('click', function () { showTab('cal'); });
    $('tabDash').addEventListener('click', function () { showTab('dash'); });
    $('btnLog').addEventListener('click', submitLog);
    $('btnEvt').addEventListener('click', submitEvent);
    $('fFilter').addEventListener('change', renderFeed);
    $('fName').addEventListener('change', function () { setMe($('fName').value); });
    $('eMe').addEventListener('change', function () { setMe($('eMe').value); });
    $('mSave').addEventListener('click', saveEdit);
    $('mCancel').addEventListener('click', closeEdit);
    $('editModal').addEventListener('click', function (ev) { if (ev.target === $('editModal')) { closeEdit(); } });
    $('mType').addEventListener('change', function () {
      $('mWhoBox').className = ($('mType').value === '개인') ? '' : 'hide';
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.edit) { closeEdit(); } });
    $('calPrev').addEventListener('click', function () { moveMonth(-1); });
    $('calNext').addEventListener('click', function () { moveMonth(1); });
    $('eType').addEventListener('change', function () {
      $('eWhoBox').className = ($('eType').value === '개인') ? '' : 'hide';
    });
    $('btnPin').addEventListener('click', function () {
      var pin = $('pinIn').value.trim();
      if (!pin) { toast('PIN을 입력해 주세요.'); return; }
      openDash(pin);
    });
    $('btnDashRef').addEventListener('click', function () {
      if (S.pin) { openDash(S.pin); loadAll(false); }
    });
  }

  bind();
  init();
  setInterval(function () { if (!document.hidden) { loadAll(true); } }, 90000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.today) { loadAll(true); }
  });
})();
</script>
<script>
(function () {
  try {
    var bar = document.getElementById('installBar');
    var go = document.getElementById('installGo');
    var msg = document.getElementById('installMsg');
    var x = document.getElementById('installX');
    if (!bar || !go || !msg || !x) { return; }
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    if (standalone) { return; }
    var snoozed = false;
    try {
      var t = Number(localStorage.getItem('solvay_install_snooze') || 0);
      snoozed = t > 0 && (Date.now() - t) < 3 * 24 * 3600 * 1000;
    } catch (e) { snoozed = false; }
    var deferred = null;
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    function show() { if (!snoozed) { bar.className = 'installbar'; } }
    function hide() { bar.className = 'installbar hide'; }
    x.addEventListener('click', function () {
      hide();
      try { localStorage.setItem('solvay_install_snooze', String(Date.now())); } catch (e) { /* 무시 */ }
    });
    go.addEventListener('click', function () {
      if (!deferred) { return; }
      try {
        deferred.prompt();
        var d = deferred;
        deferred = null;
        if (d.userChoice && d.userChoice.then) { d.userChoice.then(hide, hide); } else { hide(); }
      } catch (e) { hide(); }
    });
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      go.style.display = '';
      msg.textContent = '홈 화면에 추가하면 앱처럼 쓸 수 있어요.';
      show();
    });
    window.addEventListener('appinstalled', hide);
    if (isIOS) {
      go.style.display = 'none';
      msg.textContent = '사파리 아래의 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 선택하세요.';
      setTimeout(show, 1500);
    }
  } catch (e) { /* 설치 안내 실패는 앱 사용에 영향 없음 */ }
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}
</script>
