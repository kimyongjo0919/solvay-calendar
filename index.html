<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOLVAY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>SOLVAY</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--main:#5c1424;--main2:#f4e8ea;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand .sub{font-size:12px;color:var(--sub);margin-top:-2px}
h1{letter-spacing:1px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
h1{font-size:18px;margin:0}
.dday{background:var(--main);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--main);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--main2);color:var(--main)}
.btn.small{width:auto;margin:0;padding:6px 12px;font-size:13px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta b{color:var(--ink);font-size:13px}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.next{margin-top:4px;font-size:13px;color:var(--main);white-space:pre-wrap;word-break:break-word}
.empty{color:var(--sub);text-align:center;padding:16px 0;font-size:14px}
.del{border:1px solid #fecaca;background:#fff;color:var(--bad);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer}
.acts{display:flex;gap:6px;flex:none}
.edt{border:1px solid #d8c3c8;background:#fff;color:var(--main);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer}
.edited{color:var(--sub);font-weight:400;font-size:11px}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,7,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hide{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns button{flex:1;margin-top:0}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer}
.calhead span{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cell{height:78px;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;text-align:left;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cell.blank{border:0;background:transparent;cursor:default}
.cell.today{border-color:var(--main);box-shadow:inset 0 0 0 1px var(--main)}
.cell.sel{background:var(--main2)}
.cell .n{font-weight:700}
.cell.sun .n{color:var(--bad)}
.tag{display:block;flex:none;border-radius:4px;padding:0 3px;font-size:10px;line-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.ev{background:#fde68a;color:#78350f}
.tag.lg{background:#dcfce7;color:#14532d}
.tag.dl{background:var(--bad);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--sub)}
td.l{text-align:left;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.pill.ok{background:#dcfce7;color:var(--ok)}
.pill.warn{background:#fef3c7;color:var(--warn)}
.pill.bad{background:#fee2e2;color:var(--bad)}
.pill.no{background:#f3f4f6;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;z-index:9;display:none;text-align:center}
.hide{display:none}
#splash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;overflow:hidden;touch-action:manipulation;background:radial-gradient(circle at 22% 28%,rgba(112,72,215,.30),rgba(112,72,215,0) 55%),radial-gradient(circle at 82% 72%,rgba(55,115,255,.26),rgba(55,115,255,0) 60%),radial-gradient(circle at 70% 18%,rgba(40,175,205,.14),rgba(40,175,205,0) 40%),radial-gradient(circle at 50% 50%,#0d1434,#03040b 78%)}
#splash.fade{opacity:0;transition:opacity .22s linear;pointer-events:none}
#splashCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#splashStage{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;perspective:900px;pointer-events:none}
#splashLogo{width:min(75vw,385px);height:auto;opacity:0;transform:scale(.04);will-change:transform,opacity;backface-visibility:hidden}
#splashFlash{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(205,222,255,.85) 28%,rgba(205,222,255,0) 72%);opacity:0;pointer-events:none;will-change:opacity}
#splashTag{position:absolute;left:0;right:0;top:calc(50% + min(32vw,165px) + 22px);text-align:center;color:#cdd7ff;font-size:13px;letter-spacing:5px;opacity:0;pointer-events:none}
#splashSkip{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.35);font-size:12px;pointer-events:none}
.vh{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.pbtn{margin-top:6px;padding:13px 6px;font-size:15px}
.pprev{position:relative;margin-top:6px}
.pprev.hide{display:none}
.pprev img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.pprev .del{position:absolute;right:8px;top:8px;background:#fff}
.ph{margin-top:8px;border-radius:12px;overflow:hidden;background:#f3f4f6;color:var(--sub);font-size:12px;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ph img{width:100%;max-height:240px;object-fit:cover;display:block}
.lb{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
.lb.hide{display:none}
.lb img{max-width:100%;max-height:88vh;border-radius:8px}
.lb .x{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));color:#fff;font-size:28px;background:transparent;border:0;cursor:pointer;z-index:2}
.lb .msg{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:14px}
.ntc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.ntc.pin{border-color:var(--main);background:#fcf6f7}
.ntc h3{margin:0 0 2px;font-size:15px;word-break:break-word}
.ntc .when{font-size:11px;color:var(--sub)}
.ntc .body{white-space:pre-wrap;word-break:break-word;margin-top:6px;font-size:14px}
.ntc .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--sub)}
.ntc .who{margin-top:6px;font-size:12px;color:var(--sub);word-break:break-word}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--main2);color:var(--main)}
.chip.red{background:#fee2e2;color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-left:4px;vertical-align:middle}
.dot.hide{display:none}
@media (max-width:480px){.tabs{gap:4px}.tabs button{font-size:14px;padding:13px 2px}}
.installbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:8}
.installbar.hide{display:none}
.installbar img{width:44px;height:44px;border-radius:10px;flex:none}
.installbar .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
.installbar .t b{display:block;font-size:14px}
.installbar .go{border:0;background:var(--main);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.installbar .x{border:0;background:transparent;color:var(--sub);font-size:18px;padding:4px 6px;cursor:pointer}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabs button{padding:13px 4px}
.btn{padding:14px;font-size:17px}
@media (max-width:480px){
  .wrap{padding-left:10px;padding-right:10px}
  .card{padding:12px}
  .grid{gap:2px}
  .cell{height:72px;padding:2px;border-radius:6px}
  .tag{font-size:9px;padding:0 2px}
  .row{flex-direction:column;gap:0}
}
.err{color:var(--bad);font-size:14px;text-align:center;padding:20px 0}
/* ---- 우주 테마 ---- */
:root{color-scheme:dark;--bg:#05070f;--card:rgba(14,20,46,.80);--ink:#e8ecff;--sub:#9aa6cc;--line:rgba(140,160,255,.22);--main:#5468ff;--main2:rgba(100,125,255,.20);--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
body{background:radial-gradient(circle at 18% 8%,rgba(112,72,215,.28),rgba(112,72,215,0) 45%),radial-gradient(circle at 88% 60%,rgba(55,115,255,.20),rgba(55,115,255,0) 50%),#05070f;background-attachment:fixed}
body::before{content:"";position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;opacity:.9;background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfd8ff,transparent),radial-gradient(1.4px 1.4px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 55px 175px,#e6ebff,transparent),radial-gradient(1.2px 1.2px at 200px 190px,#b9c6ff,transparent);background-size:230px 230px}
.card{backdrop-filter:none;box-shadow:0 0 0 1px rgba(120,140,255,.05),0 8px 24px rgba(0,0,0,.35)}
.tabs button{background:rgba(14,20,46,.80);color:var(--sub)}
.tabs button.on{background:var(--main);color:#fff;border-color:#8ea0ff;box-shadow:0 0 14px rgba(84,104,255,.55)}
input,select,textarea{background:rgba(255,255,255,.06);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#6f7ba3}
.btn.ghost{background:var(--main2);color:#c7d0ff}
.next{color:#a9b6ff}
.del{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.45)}
.edt{background:rgba(100,125,255,.14);border-color:rgba(142,160,255,.5);color:#c7d0ff}
.pprev .del{background:#1a0f14}
.sheet{background:#0b1130;border-top:1px solid var(--line)}
.calhead button{background:rgba(14,20,46,.80);color:var(--ink)}
.cell{background:rgba(255,255,255,.04)}
.cell.blank{background:transparent}
.cell.today{border-color:#8ea0ff;box-shadow:inset 0 0 0 1px #8ea0ff,0 0 10px rgba(110,130,255,.45)}
.cell.sel{background:var(--main2)}
.tag.dl{background:#dc2626}
.pill.ok{background:rgba(74,222,128,.16)}
.pill.warn{background:rgba(251,191,36,.16)}
.pill.bad{background:rgba(248,113,113,.16)}
.pill.no{background:rgba(255,255,255,.08)}
.ph{background:rgba(255,255,255,.06)}
.ntc{background:rgba(255,255,255,.04)}
.ntc.pin{border-color:#8ea0ff;background:rgba(100,125,255,.14)}
.chip{color:#c7d0ff}
.chip.red{background:rgba(248,113,113,.18);color:var(--bad)}
.installbar{background:#0b1130;color:var(--ink)}
.toast{background:#1b2350;border:1px solid var(--line)}
</style>

<body>
<div id="splash" aria-hidden="true">
  <canvas id="splashCv"></canvas>
  <div id="splashStage"><img id="splashLogo" src="icons/logo-splash.png" alt=""></div>
  <div id="splashFlash"></div>
  <div id="splashTag">TEAM SOLVAY · STEAM R&amp;E</div>
  <div id="splashSkip">화면을 누르면 건너뜁니다</div>
</div>
<script>
(function () {
  var sp = document.getElementById('splash');
  window.__splashDone = false;
  var done = false, raf = 0, hardTimer = null;
  function finish() {
    if (done) { return; }
    done = true;
    try { if (raf) { cancelAnimationFrame(raf); } } catch (e) {}
    try { if (hardTimer) { clearTimeout(hardTimer); } } catch (e) {}
    try { if (sp && sp.parentNode) { sp.parentNode.removeChild(sp); } } catch (e) {}
    window.__splashDone = true;
    try { document.dispatchEvent(new Event('splashdone')); } catch (e) {}
  }
  if (!sp) { finish(); return; }
  try {
    if (sessionStorage.getItem('solvay_splash') === '1') { finish(); return; }
    sessionStorage.setItem('solvay_splash', '1');
  } catch (e) { /* 저장소를 못 써도 인트로는 그냥 보여 줍니다 */ }
  hardTimer = setTimeout(finish, 5000);
  try {
    var cv = document.getElementById('splashCv');
    var logo = document.getElementById('splashLogo');
    var flash = document.getElementById('splashFlash');
    var tag = document.getElementById('splashTag');
    var skip = document.getElementById('splashSkip');
    if (!cv || !logo || !flash || !tag || !skip) { finish(); return; }
    sp.addEventListener('click', finish);
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    if (reduce) {
      logo.style.opacity = '1';
      logo.style.transform = 'none';
      tag.style.opacity = '1';
      skip.style.display = 'none';
      setTimeout(function () { sp.className = 'fade'; }, 900);
      setTimeout(finish, 1300);
      return;
    }
    var ctx = cv.getContext('2d');
    if (!ctx) { finish(); return; }
    // 저사양 최적화: 캔버스는 1배 해상도, 별 개수 최소, 글로우는 이미지에 미리 구워 둠
    var lite = ((navigator.hardwareConcurrency || 8) <= 4) || ((navigator.deviceMemory || 8) <= 3);
    var W = window.innerWidth || 360, H = window.innerHeight || 640;
    cv.width = W; cv.height = H;
    window.addEventListener('resize', function () {
      W = window.innerWidth || W; H = window.innerHeight || H;
      cv.width = W; cv.height = H;
    });
    var N = lite ? 50 : 90, stars = [], i;
    function seed(s, anywhere) {
      var a = Math.random() * Math.PI * 2;
      var rad = 0.04 + Math.random() * 1.3;
      s.x = Math.cos(a) * rad;
      s.y = Math.sin(a) * rad;
      s.z = anywhere ? (0.05 + Math.random() * 0.95) : 1;
      s.x0 = 0; s.y0 = 0; s.x1 = 0; s.y1 = 0; s.b = 0; s.on = false;
    }
    for (i = 0; i < 160; i++) { var s0 = {}; seed(s0, true); stars.push(s0); }

    var A = 1600, Hd = 700, B = 750;
    var t0 = 0, last = 0, frames = 0, degraded = false, faded = false, tagOp = -1;
    function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
    function easeIn(p) { return p * p * p; }

    function frame(now) {
      if (done) { return; }
      if (!t0) { t0 = now; last = now; }
      var t = now - t0;
      var dt = Math.min(48, now - last) / 16.67;
      last = now;
      frames++;
      if (frames === 14 && !degraded && (now - t0) / 14 > 26) { degraded = true; N = Math.min(N, 35); }
      var speed, sc, op, rotY, rotX, tx, ty, fl, tg;
      if (t < A) {
        var p = t / A, e = easeOut(p);
        speed = 0.012 + 0.06 * (1 - p);
        sc = 0.04 + 0.96 * e;
        op = Math.min(1, p * 2.4);
        rotY = lite ? 0 : (1 - e) * -40; rotX = lite ? 0 : (1 - e) * 14;
        tx = (1 - e) * -0.22 * W; ty = (1 - e) * 0.16 * H;
        fl = 0; tg = 0;
      } else if (t < A + Hd) {
        var q = (t - A) / Hd;
        speed = 0.012;
        sc = 1 + 0.02 * Math.sin(q * Math.PI);
        op = 1; rotY = 0; rotX = 0; tx = 0; ty = 0;
        fl = 0; tg = Math.min(1, q * 2.2);
      } else {
        var r = Math.min(1, (t - A - Hd) / B), er = easeIn(r);
        speed = 0.012 + 0.1 * er;
        sc = 1 + er * 3.4;
        op = 1 - Math.max(0, (r - 0.5) / 0.5);
        rotY = 0; rotX = 0; tx = 0; ty = 0;
        fl = Math.sin(Math.min(1, r * 1.15) * Math.PI) * 0.9;
        tg = Math.max(0, 1 - r * 3);
        if (r > 0.72 && !faded) { faded = true; sp.className = 'fade'; }
        if (r >= 1) { finish(); return; }
      }
      logo.style.opacity = op.toFixed(2);
      logo.style.transform = (rotY === 0 && rotX === 0)
        ? 'translate3d(' + tx.toFixed(0) + 'px,' + ty.toFixed(0) + 'px,0) scale(' + sc.toFixed(3) + ')'
        : 'translate3d(' + tx.toFixed(0) + 'px,' + ty.toFixed(0) + 'px,0) rotateY(' + rotY.toFixed(1) + 'deg) rotateX(' + rotX.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      flash.style.opacity = fl.toFixed(2);
      var tgs = tg.toFixed(2);
      if (tagOp !== tgs) { tagOp = tgs; tag.style.opacity = tgs; }

      ctx.clearRect(0, 0, W, H);
      var f = Math.min(W, H) * 0.55, cx = W / 2, cy = H / 2, n = Math.min(N, stars.length), b;
      for (i = 0; i < n; i++) {
        var s = stars[i];
        s.on = false;
        var zPrev = s.z + speed * 2.2;
        s.z -= speed * dt;
        if (s.z <= 0.03) { seed(s, false); continue; }
        var x1 = cx + (s.x / s.z) * f, y1 = cy + (s.y / s.z) * f;
        if (x1 < -30 || x1 > W + 30 || y1 < -30 || y1 > H + 30) { seed(s, false); continue; }
        var zp = zPrev > 1.4 ? 1.4 : zPrev;
        s.x0 = cx + (s.x / zp) * f; s.y0 = cy + (s.y / zp) * f; s.x1 = x1; s.y1 = y1;
        s.b = s.z > 0.6 ? 0 : (s.z > 0.3 ? 1 : 2);
        s.on = true;
      }
      ctx.lineCap = 'round';
      for (b = 0; b < 3; b++) {
        ctx.strokeStyle = b === 0 ? 'rgba(200,215,255,0.35)' : (b === 1 ? 'rgba(225,235,255,0.65)' : 'rgba(255,255,255,0.95)');
        ctx.lineWidth = b === 0 ? 0.8 : (b === 1 ? 1.4 : 2.2);
        ctx.beginPath();
        for (i = 0; i < n; i++) {
          var st = stars[i];
          if (st.on && st.b === b) { ctx.moveTo(st.x0, st.y0); ctx.lineTo(st.x1, st.y1); }
        }
        ctx.stroke();
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  } catch (e) {
    finish();
  }
})();
</script>

<script>
(function () {
  'use strict';

  var S = { students: [], groups: {}, me: '', edit: null, photo: { full: '', thumb: '' }, mp: { mode: 'keep', full: '', thumb: '', has: false }, notices: [], nEdit: '', deadline: '', today: '', logs: [], events: [], pin: '', year: 0, month: 0, sel: '', busy: false };
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = text; }
    return e;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dnum(s) {
    var p = String(s).split('-');
    return Math.round(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 86400000);
  }
  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2800);
  }

  function apiUrl() { return String(window.SOLVAY_API_URL || '').trim(); }

  function buildRequest(fn, a) {
    var url = apiUrl();
    if (fn === 'getInit') { return { method: 'GET', url: url + '?action=init&_=' + Date.now() }; }
    if (fn === 'getAll') { return { method: 'GET', url: url + '?action=all&_=' + Date.now() }; }
    if (fn === 'getThumbs') { return { method: 'GET', url: url + '?action=thumbs&ids=' + encodeURIComponent(a[0]) + '&_=' + Date.now() }; }
    if (fn === 'getPhoto') { return { method: 'GET', url: url + '?action=photo&id=' + encodeURIComponent(a[0]) + '&_=' + Date.now() }; }
    var body = null;
    if (fn === 'addLog') { body = { action: 'addLog', name: a[0], date: a[1], done: a[2], next: a[3], photo: a[4], thumb: a[5] }; }
    else if (fn === 'addEvent') { body = { action: 'addEvent', title: a[0], date: a[1], who: a[2], type: a[3], creator: a[4] }; }
    else if (fn === 'updateLog') { body = { action: 'updateLog', id: a[0], editor: a[1], pin: a[2], date: a[3], done: a[4], next: a[5], photo: a[6], thumb: a[7], removePhoto: a[8] }; }
    else if (fn === 'postNotice') { body = { action: 'postNotice', pin: a[0], title: a[1], body: a[2], sticky: a[3], due: a[4] }; }
    else if (fn === 'updateNotice') { body = { action: 'updateNotice', id: a[0], pin: a[1], title: a[2], body: a[3], sticky: a[4], due: a[5] }; }
    else if (fn === 'deleteNotice') { body = { action: 'deleteNotice', id: a[0], pin: a[1] }; }
    else if (fn === 'readNotice') { body = { action: 'readNotice', id: a[0], name: a[1] }; }
    else if (fn === 'updateEvent') { body = { action: 'updateEvent', id: a[0], editor: a[1], pin: a[2], title: a[3], date: a[4], who: a[5], type: a[6] }; }
    else if (fn === 'getDashboard') { body = { action: 'dashboard', pin: a[0] }; }
    else if (fn === 'deleteItem') { body = { action: 'delete', kind: a[0], id: a[1], pin: a[2], editor: a[3] }; }
    if (!body) { return null; }
    return { method: 'POST', url: url, body: JSON.stringify(body) };
  }

  function call(fn, args, onOk, onBad) {
    var failed = function (msg) {
      if (onBad) { onBad(msg); } else { toast(msg); }
    };
    var base = apiUrl();
    if (base.indexOf('http') !== 0) {
      failed('config.js에 웹앱 주소(URL)가 입력되지 않았습니다.');
      return;
    }
    var req = buildRequest(fn, args);
    if (!req) { failed('알 수 없는 요청입니다.'); return; }
    var ctrl = null, timer = null;
    try {
      if (window.AbortController) {
        ctrl = new AbortController();
        timer = setTimeout(function () { ctrl.abort(); }, req.method === 'POST' ? 60000 : 30000);
      }
    } catch (e) { ctrl = null; }
    var opts = { method: req.method, redirect: 'follow', cache: 'no-store' };
    if (req.method === 'POST') {
      opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opts.body = req.body;
    }
    if (ctrl) { opts.signal = ctrl.signal; }
    var handleOk = function (res) {
      if (timer) { clearTimeout(timer); }
      if (!res) { failed('응답이 없습니다. 잠시 후 다시 시도해 주세요.'); return; }
      if (res.ok === false) { failed(res.msg || '처리하지 못했습니다.'); return; }
      onOk(res);
    };
    var handleFail = function () {
      if (timer) { clearTimeout(timer); }
      failed('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    };
    try {
      fetch(req.url, opts)
        .then(function (r) { return r.json(); })
        .then(handleOk, handleFail);
    } catch (e) {
      handleFail();
    }
  }

  /* ---------- 탭 ---------- */
  function showTab(which) {
    var map = { log: ['tabLog', 'paneLog'], cal: ['tabCal', 'paneCal'], ntc: ['tabNtc', 'paneNtc'], dash: ['tabDash', 'paneDash'] };
    for (var k in map) {
      if (Object.prototype.hasOwnProperty.call(map, k)) {
        $(map[k][0]).className = (k === which) ? 'on' : '';
        $(map[k][1]).className = (k === which) ? '' : 'hide';
      }
    }
    if (which === 'cal') { renderCal(); }
    if (which === 'ntc') { renderNotices(); }
  }

  /* ---------- 초기화 ---------- */
  function fillStudents() {
    var sels = ['fName', 'eWho', 'eMe', 'nMe', 'mWho'];
    var saved = '';
    try { saved = localStorage.getItem('steam_name') || ''; } catch (e) { saved = ''; }
    for (var i = 0; i < sels.length; i++) {
      var s = $(sels[i]);
      clear(s);
      var first = el('option', '', '이름 선택');
      first.value = '';
      s.appendChild(first);
      appendGrouped(s);
    }
    if (saved && S.students.indexOf(saved) >= 0) { S.me = saved; $('fName').value = saved; $('eMe').value = saved; $('nMe').value = saved; }
    var f = $('fFilter');
    clear(f);
    var all = el('option', '', '전체 보기');
    all.value = '';
    f.appendChild(all);
    appendGrouped(f);
  }

  function appendGrouped(sel) {
    var order = [];
    var i;
    for (i = 0; i < S.students.length; i++) {
      var g = S.groups[S.students[i]] || '';
      if (order.indexOf(g) < 0) { order.push(g); }
    }
    for (var gi = 0; gi < order.length; gi++) {
      var parent = sel;
      if (order[gi]) {
        parent = document.createElement('optgroup');
        parent.label = order[gi];
        sel.appendChild(parent);
      }
      for (i = 0; i < S.students.length; i++) {
        if ((S.groups[S.students[i]] || '') !== order[gi]) { continue; }
        var o = el('option', '', S.students[i]);
        o.value = S.students[i];
        parent.appendChild(o);
      }
    }
  }

  function renderDday() {
    var d = $('dday');
    if (!S.deadline || !validDate(S.deadline) || !validDate(S.today)) { d.textContent = 'STEAM R&E'; return; }
    var diff = dnum(S.deadline) - dnum(S.today);
    d.textContent = diff > 0 ? ('마감 D-' + diff) : (diff === 0 ? '마감 D-Day' : ('마감 D+' + (-diff)));
  }

  function whenSplashDone(fn) {
    if (window.__splashDone || !document.getElementById('splash')) { fn(); return; }
    var ran = false;
    var go = function () { if (ran) { return; } ran = true; fn(); };
    document.addEventListener('splashdone', go);
    setTimeout(go, 6000);
  }

  function init() {
    call('getInit', [], function (res) {
      whenSplashDone(function () {
      S.students = res.students || [];
      S.groups = res.groups || {};
      S.deadline = res.deadline || '';
      S.today = res.today || '';
      var p = S.today.split('-');
      S.year = Number(p[0]);
      S.month = Number(p[1]) - 1;
      S.sel = S.today;
      $('initErr').className = 'err hide';
      $('fDate').value = S.today;
      $('eDate').value = S.today;
      fillStudents();
      renderDday();
      loadAll(false);
      setupPush(res.pushAppId);
      });
    }, function (msg) {
      var e = $('initErr');
      e.textContent = msg + ' (새로고침 해 주세요)';
      e.className = 'err';
    });
  }

  function loadAll(silent) {
    call('getAll', [], function (res) {
      S.logs = res.logs || [];
      S.events = res.events || [];
      S.notices = res.notices || [];
      if (res.today) { S.today = res.today; renderDday(); }
      renderFeed();
      renderCal();
      renderNotices();
    }, function (msg) {
      if (!silent) { toast(msg); }
    });
  }

  /* ---------- 기록 ---------- */
  function renderFeed() {
    var box = $('feed');
    clear(box);
    var who = $('fFilter').value;
    var shown = 0;
    for (var i = 0; i < S.logs.length && shown < 60; i++) {
      var L = S.logs[i];
      if (who && L.name !== who) { continue; }
      shown++;
      var it = el('div', 'item');
      var meta = el('div', 'meta');
      var left = el('span');
      left.appendChild(el('b', '', L.name));
      left.appendChild(document.createTextNode('  ' + L.date));
      if (L.mod) { left.appendChild(el('span', 'edited', ' · 수정됨')); }
      meta.appendChild(left);
      appendActions(meta, 'log', L);
      it.appendChild(meta);
      it.appendChild(el('div', 'txt', L.done));
      if (L.next) { it.appendChild(el('div', 'next', '다음: ' + L.next)); }
      if (L.th || L.ph) { it.appendChild(makePhoto(L)); }
      box.appendChild(it);
    }
    if (!shown) { box.appendChild(el('div', 'empty', '아직 기록이 없어요.')); }
  }

  /* ---------- 사진 (촬영·압축·표시) ---------- */
  function readImage(file, ok, bad) {
    var url = '';
    try { url = URL.createObjectURL(file); } catch (e) { bad(); return; }
    var im = new Image();
    im.onload = function () {
      try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ }
      ok(im);
    };
    im.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ }
      bad();
    };
    im.src = url;
  }

  function shrink(im, maxSide, q) {
    var w = im.naturalWidth || im.width;
    var h2 = im.naturalHeight || im.height;
    var sc = Math.min(1, maxSide / Math.max(w, h2));
    var cw = Math.max(1, Math.round(w * sc));
    var ch = Math.max(1, Math.round(h2 * sc));
    var c = document.createElement('canvas');
    c.width = cw;
    c.height = ch;
    var g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, cw, ch);
    g.drawImage(im, 0, 0, cw, ch);
    var out = c.toDataURL('image/jpeg', q);
    if (out.indexOf('data:image/jpeg') !== 0) { throw new Error('jpeg'); }
    return out;
  }

  function compressFile(file, done, fail) {
    readImage(file, function (im) {
      try {
        var q = 0.72, side = 1280, tries = 0;
        var full = shrink(im, side, q);
        while (full.length > 1250000 && tries < 4) {
          q -= 0.1;
          if (tries >= 1) { side = 1024; }
          full = shrink(im, side, q);
          tries++;
        }
        if (full.length > 1250000) { fail(); return; }
        done(full, shrink(im, 360, 0.7));
      } catch (e) {
        fail();
      }
    }, fail);
  }

  function onPick(input, apply) {
    var f = input.files && input.files[0];
    try { input.value = ''; } catch (e) { /* 무시 */ }
    if (!f) { return; }
    toast('사진을 줄이는 중...');
    compressFile(f, function (full, thumb) {
      apply(full, thumb);
      toast('사진을 담았어요.');
    }, function () {
      toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.');
    });
  }

  function setLogPhoto(full, thumb) {
    S.photo = { full: full, thumb: thumb };
    if (full) {
      $('pImg').src = thumb || full;
      $('pPrev').className = 'pprev';
    } else {
      $('pImg').removeAttribute('src');
      $('pPrev').className = 'pprev hide';
    }
  }

  function renderMPhoto() {
    var m = S.mp;
    if (m.mode === 'new') {
      $('mImg').src = m.thumb || m.full;
      $('mPrev').className = 'pprev';
      $('mPText').textContent = '새 사진으로 바꿔요.';
    } else {
      $('mImg').removeAttribute('src');
      $('mPrev').className = 'pprev hide';
      $('mPText').textContent = (m.mode === 'remove') ? '저장하면 사진이 삭제돼요.' : (m.has ? '현재 사진이 저장되어 있어요.' : '등록된 사진이 없어요.');
    }
    $('mPClear').className = (m.mode === 'new' || (m.mode === 'keep' && m.has)) ? 'del' : 'del hide';
  }

  var thumbCache = {}, fullCache = {}, fullKeys = [], pendingThumbs = [], pumping = false, io = null, lbId = '';
  try {
    if (window.IntersectionObserver) {
      io = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            io.unobserve(entries[i].target);
            queueThumb(entries[i].target.getAttribute('data-th'));
          }
        }
      }, { rootMargin: '300px' });
    }
  } catch (e) { io = null; }

  function fillThumb(box, url) {
    clear(box);
    var im = el('img');
    im.src = url;
    im.alt = '활동 사진';
    box.appendChild(im);
  }

  function applyThumb(id) {
    var list = document.querySelectorAll('.ph[data-th="' + id + '"]');
    for (var i = 0; i < list.length; i++) {
      if (thumbCache[id] && thumbCache[id] !== 'err') { fillThumb(list[i], thumbCache[id]); }
      else { list[i].textContent = '사진을 불러오지 못했어요. 눌러서 다시 시도'; }
    }
  }

  function pumpThumbs() {
    if (pumping || !pendingThumbs.length) { return; }
    pumping = true;
    var batch = pendingThumbs.splice(0, 6);
    var finishBatch = function (map) {
      for (var i = 0; i < batch.length; i++) {
        thumbCache[batch[i]] = (map && map[batch[i]]) ? map[batch[i]] : 'err';
        applyThumb(batch[i]);
      }
      pumping = false;
      if (pendingThumbs.length) { pumpThumbs(); }
    };
    call('getThumbs', [batch.join(',')], function (res) { finishBatch(res.map || {}); }, function () { finishBatch({}); });
  }

  function queueThumb(id) {
    if (!id || thumbCache[id]) { return; }
    if (pendingThumbs.indexOf(id) < 0) { pendingThumbs.push(id); }
    setTimeout(pumpThumbs, 40);
  }

  function makePhoto(L) {
    var id = L.th || L.ph;
    var box = el('div', 'ph');
    box.setAttribute('data-th', id);
    if (thumbCache[id] && thumbCache[id] !== 'err') { fillThumb(box, thumbCache[id]); }
    else if (thumbCache[id] === 'err') { box.textContent = '사진을 불러오지 못했어요. 눌러서 다시 시도'; }
    else {
      box.textContent = '📷 사진 불러오는 중...';
      if (io) { io.observe(box); } else { queueThumb(id); }
    }
    box.addEventListener('click', function () {
      if (thumbCache[id] === 'err') {
        delete thumbCache[id];
        box.textContent = '📷 사진 불러오는 중...';
        queueThumb(id);
        return;
      }
      openPhoto(L.ph || L.th, thumbCache[id]);
    });
    return box;
  }

  function openPhoto(id, thumbUrl) {
    lbId = id;
    var im = $('lbImg');
    $('lb').className = 'lb';
    $('lbMsg').textContent = '';
    if (fullCache[id]) { im.src = fullCache[id]; return; }
    if (thumbUrl && thumbUrl !== 'err') { im.src = thumbUrl; } else { im.removeAttribute('src'); }
    $('lbMsg').textContent = '원본 불러오는 중...';
    call('getPhoto', [id], function (res) {
      fullCache[id] = res.data;
      fullKeys.push(id);
      if (fullKeys.length > 5) { delete fullCache[fullKeys.shift()]; }
      if (lbId === id && $('lb').className === 'lb') {
        $('lbImg').src = res.data;
        $('lbMsg').textContent = '';
      }
    }, function (msg) {
      if (lbId === id) { $('lbMsg').textContent = msg; }
    });
  }

  function closePhoto() {
    lbId = '';
    $('lb').className = 'lb hide';
    $('lbImg').removeAttribute('src');
  }

  /* ---------- 알림장 ---------- */
  function studentCount() {
    var n = 0;
    for (var i = 0; i < S.students.length; i++) {
      if (S.groups[S.students[i]] !== '지도교사') { n++; }
    }
    return n;
  }

  function readersOf(n) {
    var out = [];
    var rs = n.readers || [];
    for (var i = 0; i < rs.length; i++) {
      if (S.groups[rs[i]] !== '지도교사') { out.push(rs[i]); }
    }
    return out;
  }

  function hasRead(n) {
    return !!S.me && (n.readers || []).indexOf(S.me) >= 0;
  }

  function updateNtcDot() {
    var unread = 0;
    if (S.me && S.groups[S.me] !== '지도교사') {
      for (var i = 0; i < S.notices.length; i++) {
        if (!hasRead(S.notices[i])) { unread++; }
      }
    }
    $('ntcDot').className = unread ? 'dot' : 'dot hide';
  }

  function renderNotices() {
    var box = $('nList');
    clear(box);
    var hint = '';
    if (!S.me) { hint = '내 이름을 선택하면 "확인했어요"를 누를 수 있어요. '; }
    if (!S.pin) { hint += '글쓰기는 교사 현황 탭에서 PIN을 입력하면 열려요.'; }
    $('nHint').textContent = hint;
    $('nComposer').className = S.pin ? 'card' : 'card hide';
    if (!S.notices.length) { box.appendChild(el('div', 'empty', '아직 알림장 글이 없어요.')); }
    for (var i = 0; i < S.notices.length; i++) {
      box.appendChild(noticeCard(S.notices[i]));
    }
    updateNtcDot();
  }

  function noticeCard(n) {
    var c = el('div', n.sticky ? 'ntc pin' : 'ntc');
    c.appendChild(el('h3', '', (n.sticky ? '📌 ' : '') + n.title));
    var when = el('div', 'when', (n.ts || '').slice(0, 16) + (n.mod ? ' · 수정됨' : '') + '  ');
    if (n.due && validDate(S.today)) {
      var d = dnum(n.due) - dnum(S.today);
      var txt = d > 0 ? ('마감 D-' + d) : (d === 0 ? '마감 D-Day' : '마감 지남');
      when.appendChild(el('span', d <= 1 ? 'chip red' : 'chip', txt));
    }
    c.appendChild(when);
    if (n.body) { c.appendChild(el('div', 'body', n.body)); }
    var foot = el('div', 'foot');
    foot.appendChild(el('span', '', '확인 ' + readersOf(n).length + '/' + studentCount() + '명'));
    var right = el('span', 'acts');
    if (S.me && S.groups[S.me] !== '지도교사') {
      if (hasRead(n)) {
        right.appendChild(el('span', 'chip', '✓ 확인함'));
      } else {
        var rb = el('button', 'btn small', '확인했어요');
        rb.type = 'button';
        rb.addEventListener('click', function () {
          rb.disabled = true;
          call('readNotice', [n.id, S.me], function () {
            if (!n.readers) { n.readers = []; }
            if (n.readers.indexOf(S.me) < 0) { n.readers.push(S.me); }
            renderNotices();
            loadAll(true);
          }, function (msg) {
            rb.disabled = false;
            toast(msg);
          });
        });
        right.appendChild(rb);
      }
    }
    if (S.pin) {
      var eb = el('button', 'edt', '수정');
      eb.type = 'button';
      eb.addEventListener('click', function () { editNotice(n); });
      right.appendChild(eb);
      var db = el('button', 'del', '삭제');
      db.type = 'button';
      db.addEventListener('click', function () {
        if (!window.confirm('이 알림장 글을 삭제할까요?')) { return; }
        call('deleteNotice', [n.id, S.pin], function () {
          toast('삭제했습니다.');
          loadAll(false);
        });
      });
      right.appendChild(db);
    }
    foot.appendChild(right);
    c.appendChild(foot);
    if (S.pin) {
      var rd = readersOf(n);
      var un = [];
      for (var i = 0; i < S.students.length; i++) {
        var nm = S.students[i];
        if (S.groups[nm] !== '지도교사' && rd.indexOf(nm) < 0) { un.push(nm); }
      }
      c.appendChild(el('div', 'who', un.length ? ('아직 안 읽은 사람: ' + un.join(', ')) : '모두 확인했어요!'));
    }
    return c;
  }

  /* ---------- 푸시 알림 (OneSignal) ---------- */
  var OS = null, pushReady = false;

  function isStandalone() {
    try {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    } catch (e) { return false; }
  }

  function pushUi() {
    var b = $('pushBtn'), m = $('pushMsg');
    var iosTab = /iPad|iPhone|iPod/.test(navigator.userAgent) && !isStandalone();
    if (iosTab) {
      b.className = 'btn ghost';
      b.disabled = true;
      m.textContent = '아이폰은 Safari 공유 버튼(□↑)에서 "홈 화면에 추가" 후, 설치된 SOLVAY 앱에서 알림을 켤 수 있어요.';
      return;
    }
    if (!('Notification' in window)) {
      b.className = 'btn ghost hide';
      m.textContent = '이 브라우저는 알림을 지원하지 않아요.';
      return;
    }
    b.className = 'btn ghost';
    if (Notification.permission === 'granted') {
      b.textContent = '🔔 알림 켜짐';
      b.disabled = true;
      m.textContent = '';
    } else if (Notification.permission === 'denied') {
      b.disabled = true;
      m.textContent = '알림이 차단되어 있어요. 폰 설정 > 앱(브라우저) 알림에서 허용해 주세요.';
    } else {
      b.textContent = '🔔 새 글 알림 받기';
      b.disabled = !pushReady;
      m.textContent = pushReady ? '' : '알림 준비 중...';
    }
  }

  function setupPush(appId) {
    try {
      if (!appId) { return; }
      pushUi();
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      var base = location.pathname.replace(/[^\/]*$/, '');
      window.OneSignalDeferred.push(function (OneSignal) {
        try {
          OS = OneSignal;
          var r = OneSignal.init({
            appId: appId,
            serviceWorkerPath: base.replace(/^\//, '') + 'sw.js',
            serviceWorkerParam: { scope: base }
          });
          Promise.resolve(r).then(function () {
            pushReady = true;
            pushUi();
          }, function (err) {
            var t = '';
            try { t = String((err && err.message) || err || '').slice(0, 140); } catch (e2) { t = ''; }
            $('pushMsg').textContent = '알림 준비에 실패했어요. ' + t;
          });
        } catch (e) { /* 무시 */ }
      });
      var sc = document.createElement('script');
      sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
      sc.defer = true;
      sc.onerror = function () { $('pushMsg').textContent = '알림 도구를 불러오지 못했어요.'; };
      document.head.appendChild(sc);
      setTimeout(function () {
        if (!pushReady && Notification.permission === 'default' && $('pushMsg').textContent === '알림 준비 중...') {
          $('pushMsg').textContent = '알림 준비가 오래 걸려요. 앱을 완전히 닫았다 다시 열어 주세요. 계속되면 OneSignal 사이트 주소 설정을 확인해야 해요.';
        }
      }, 12000);
    } catch (e) { /* 무시 */ }
  }

  function askPush() {
    try {
      if (!OS || !OS.Notifications) { toast('알림 준비 중이에요. 잠시 후 다시 눌러 주세요.'); return; }
      Promise.resolve(OS.Notifications.requestPermission()).then(function () {
        pushUi();
        if (Notification.permission === 'granted') { toast('알림을 켰어요.'); }
      }, function () { pushUi(); });
    } catch (e) { toast('알림을 켜지 못했어요.'); }
  }

  /* ---------- 일정 ---------- */
  function renderCal() {
    if (!S.year) { return; }
    $('calTitle').textContent = S.year + '년 ' + (S.month + 1) + '월';
    var g = $('calGrid');
    clear(g);
    for (var d = 0; d < 7; d++) { g.appendChild(el('div', 'dow', DOW[d])); }

    var evBy = {}, lgBy = {};
    for (var i = 0; i < S.events.length; i++) {
      var e = S.events[i];
      if (!evBy[e.date]) { evBy[e.date] = []; }
      evBy[e.date].push(e);
    }
    for (var j = 0; j < S.logs.length; j++) {
      var l = S.logs[j];
      lgBy[l.date] = (lgBy[l.date] || 0) + 1;
    }

    var first = new Date(Date.UTC(S.year, S.month, 1)).getUTCDay();
    var days = new Date(Date.UTC(S.year, S.month + 1, 0)).getUTCDate();
    for (var b = 0; b < first; b++) { g.appendChild(el('div', 'cell blank')); }
    for (var n = 1; n <= days; n++) {
      var key = S.year + '-' + pad(S.month + 1) + '-' + pad(n);
      var cls = 'cell';
      if (key === S.today) { cls += ' today'; }
      if (key === S.sel) { cls += ' sel'; }
      if ((first + n - 1) % 7 === 0) { cls += ' sun'; }
      var c = el('button', cls);
      c.type = 'button';
      c.appendChild(el('span', 'n', String(n)));
      if (key === S.deadline) { c.appendChild(el('span', 'tag dl', '마감')); }
      var evs = evBy[key] || [];
      if (evs.length) {
        c.appendChild(el('span', 'tag ev', (evs.length > 1 ? '(' + evs.length + ') ' : '') + evs[0].title));
      }
      if (lgBy[key]) { c.appendChild(el('span', 'tag lg', '기록 ' + lgBy[key])); }
      c.addEventListener('click', (function (k) {
        return function () { S.sel = k; $('eDate').value = k; renderCal(); };
      })(key));
      g.appendChild(c);
    }
    renderDay();
  }

  function renderDay() {
    var box = $('dayList');
    clear(box);
    if (!S.sel) { return; }
    $('dayTitle').textContent = S.sel + (S.sel === S.deadline ? ' (최종 마감일)' : '');
    var any = false, i;
    for (i = 0; i < S.events.length; i++) {
      var e = S.events[i];
      if (e.date !== S.sel) { continue; }
      any = true;
      var it = el('div', 'item');
      var meta = el('div', 'meta');
      meta.appendChild(el('b', '', (e.type === '개인' ? '[개인] ' : '[전체] ') + e.who));
      appendActions(meta, 'event', e);
      it.appendChild(meta);
      it.appendChild(el('div', 'txt', e.title));
      if (e.by) { it.appendChild(el('div', 'edited', '작성: ' + e.by + (e.mod ? ' · 수정됨' : ''))); }
      box.appendChild(it);
    }
    for (i = 0; i < S.logs.length; i++) {
      var L = S.logs[i];
      if (L.date !== S.sel) { continue; }
      any = true;
      var it2 = el('div', 'item');
      var m2 = el('div', 'meta');
      m2.appendChild(el('b', '', '[기록] ' + L.name));
      appendActions(m2, 'log', L);
      it2.appendChild(m2);
      it2.appendChild(el('div', 'txt', L.done));
      if (L.th || L.ph) { it2.appendChild(makePhoto(L)); }
      box.appendChild(it2);
    }
    if (!any) { box.appendChild(el('div', 'empty', '이 날은 일정과 기록이 없어요.')); }
  }

  function moveMonth(delta) {
    var m = S.month + delta;
    var y = S.year;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    S.month = m;
    S.year = y;
    renderCal();
  }

  function submitEvent() {
    if (S.busy) { return; }
    var title = $('eTitle').value.trim();
    var date = $('eDate').value;
    var type = $('eType').value;
    var who = $('eWho').value;
    if (!title) { toast('일정 제목을 적어 주세요.'); return; }
    if (!validDate(date)) { toast('날짜를 선택해 주세요.'); return; }
    if (type === '개인' && !who) { toast('담당 학생을 선택해 주세요.'); return; }
    var me = $('eMe').value;
    if (!me) { toast('작성자(내 이름)를 선택해 주세요.'); return; }
    S.busy = true;
    $('btnEvt').disabled = true;
    $('btnEvt').textContent = '저장 중...';
    var release = function () {
      S.busy = false;
      $('btnEvt').disabled = false;
      $('btnEvt').textContent = '일정 저장';
    };
    call('addEvent', [title, date, who, type, me], function () {
      release();
      $('eTitle').value = '';
      S.sel = date;
      var p = date.split('-');
      S.year = Number(p[0]);
      S.month = Number(p[1]) - 1;
      toast('일정을 저장했습니다.');
      loadAll(false);
    }, function (msg) {
      release();
      toast(msg);
    });
  }

  /* ---------- 교사 현황 ---------- */
  function renderDash(res) {
    $('pinBox').className = 'card hide';
    $('dashBox').className = 'card';
    $('dashInfo').textContent = '기준일 ' + res.today + ' · 3일 이상 기록이 없으면 빨간색으로 표시됩니다.';
    var box = $('dashTable');
    clear(box);
    var tb = el('table');
    var head = el('tr');
    var cols = ['이름', '오늘', '최근 기록', '7일', '전체'];
    for (var c = 0; c < cols.length; c++) { head.appendChild(el('th', '', cols[c])); }
    tb.appendChild(head);
    var rows = res.rows || [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var tr = el('tr');
      tr.appendChild(el('td', 'l', r.name));
      var t1 = el('td');
      t1.appendChild(el('span', r.today ? 'pill ok' : 'pill no', r.today ? '완료' : '없음'));
      tr.appendChild(t1);
      var t2 = el('td');
      if (r.since < 0) {
        t2.appendChild(el('span', 'pill bad', '기록 없음'));
      } else {
        var cls = r.since >= 3 ? 'pill bad' : (r.since >= 2 ? 'pill warn' : 'pill ok');
        var txt = r.since === 0 ? '오늘' : (r.since + '일 전');
        t2.appendChild(el('span', cls, txt));
      }
      tr.appendChild(t2);
      tr.appendChild(el('td', '', String(r.week)));
      tr.appendChild(el('td', '', String(r.total)));
      tb.appendChild(tr);
    }
    box.appendChild(tb);
    if (!rows.length) { box.appendChild(el('div', 'empty', '설정 시트에 학생 명단이 없습니다.')); }
  }

  function openDash(pin) {
    call('getDashboard', [pin], function (res) {
      S.pin = pin;
      renderDash(res);
      renderFeed();
      renderDay();
      renderNotices();
    }, function (msg) {
      toast(msg);
    });
  }

  /* ---------- 이벤트 연결 ---------- */
  function bind() {
    $('tabLog').addEventListener('click', function () { showTab('log'); });
    $('tabCal').addEventListener('click', function () { showTab('cal'); });
    $('tabDash').addEventListener('click', function () { showTab('dash'); });
    $('btnLog').addEventListener('click', submitLog);
    $('btnEvt').addEventListener('click', submitEvent);
    $('fFilter').addEventListener('change', renderFeed);
    $('fName').addEventListener('change', function () { setMe($('fName').value); });
    $('eMe').addEventListener('change', function () { setMe($('eMe').value); });
    $('mSave').addEventListener('click', saveEdit);
    $('tabNtc').addEventListener('click', function () { showTab('ntc'); });
    $('nMe').addEventListener('change', function () { setMe($('nMe').value); });
    $('nSave').addEventListener('click', saveNotice);
    $('pushBtn').addEventListener('click', askPush);
    $('nCancel').addEventListener('click', resetComposer);
    $('pCam').addEventListener('click', function () { $('pFileCam').click(); });
    $('pPick').addEventListener('click', function () { $('pFilePick').click(); });
    $('pFileCam').addEventListener('change', function () { onPick($('pFileCam'), setLogPhoto); });
    $('pFilePick').addEventListener('change', function () { onPick($('pFilePick'), setLogPhoto); });
    $('pClear').addEventListener('click', function () { setLogPhoto('', ''); });
    var mSet = function (full, thumb) { S.mp.mode = 'new'; S.mp.full = full; S.mp.thumb = thumb; renderMPhoto(); };
    $('mPCam').addEventListener('click', function () { $('mFileCam').click(); });
    $('mPPick').addEventListener('click', function () { $('mFilePick').click(); });
    $('mFileCam').addEventListener('change', function () { onPick($('mFileCam'), mSet); });
    $('mFilePick').addEventListener('change', function () { onPick($('mFilePick'), mSet); });
    $('mPClear').addEventListener('click', function () {
      if (S.mp.mode === 'new') { S.mp.mode = 'keep'; S.mp.full = ''; S.mp.thumb = ''; }
      else if (S.mp.mode === 'keep' && S.mp.has) { S.mp.mode = 'remove'; }
      renderMPhoto();
    });
    $('lb').addEventListener('click', closePhoto);
    $('lbX').addEventListener('click', closePhoto);
    $('mCancel').addEventListener('click', closeEdit);
    $('editModal').addEventListener('click', function (ev) { if (ev.target === $('editModal')) { closeEdit(); } });
    $('mType').addEventListener('change', function () {
      $('mWhoBox').className = ($('mType').value === '개인') ? '' : 'hide';
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') { return; }
      if ($('lb').className === 'lb') { closePhoto(); } else if (S.edit) { closeEdit(); }
    });
    $('calPrev').addEventListener('click', function () { moveMonth(-1); });
    $('calNext').addEventListener('click', function () { moveMonth(1); });
    $('eType').addEventListener('change', function () {
      $('eWhoBox').className = ($('eType').value === '개인') ? '' : 'hide';
    });
    $('btnPin').addEventListener('click', function () {
      var pin = $('pinIn').value.trim();
      if (!pin) { toast('PIN을 입력해 주세요.'); return; }
      openDash(pin);
    });
    $('btnDashRef').addEventListener('click', function () {
      if (S.pin) { openDash(S.pin); loadAll(false); }
    });
  }

  bind();
  init();
  setInterval(function () { if (!document.hidden) { loadAll(true); } }, 90000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.today) { loadAll(true); }
  });
})();
</script>
<script>
(function () {
  try {
    var bar = document.getElementById('installBar');
    var go = document.getElementById('installGo');
    var msg = document.getElementById('installMsg');
    var x = document.getElementById('installX');
    if (!bar || !go || !msg || !x) { return; }
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    if (standalone) { return; }
    var snoozed = false;
    try {
      var t = Number(localStorage.getItem('solvay_install_snooze') || 0);
      snoozed = t > 0 && (Date.now() - t) < 3 * 24 * 3600 * 1000;
    } catch (e) { snoozed = false; }
    var deferred = null;
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    function show() { if (!snoozed) { bar.className = 'installbar'; } }
    function hide() { bar.className = 'installbar hide'; }
    x.addEventListener('click', function () {
      hide();
      try { localStorage.setItem('solvay_install_snooze', String(Date.now())); } catch (e) { /* 무시 */ }
    });
    go.addEventListener('click', function () {
      if (!deferred) { return; }
      try {
        deferred.prompt();
        var d = deferred;
        deferred = null;
        if (d.userChoice && d.userChoice.then) { d.userChoice.then(hide, hide); } else { hide(); }
      } catch (e) { hide(); }
    });
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      go.style.display = '';
      msg.textContent = '홈 화면에 추가하면 앱처럼 쓸 수 있어요.';
      show();
    });
    window.addEventListener('appinstalled', hide);
    if (isIOS) {
      go.style.display = 'none';
      msg.textContent = '사파리 아래의 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 선택하세요.';
      setTimeout(show, 1500);
    }
  } catch (e) { /* 설치 안내 실패는 앱 사용에 영향 없음 */ }
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}
</script>
